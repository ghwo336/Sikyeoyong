<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>시켜용 주문 상세</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Pretendard";src:url(/_blob/595108c608f096ad66f6d78ef534a70e) format("woff2");font-weight:45 920;font-display:swap}
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid #2E7D4F;outline-offset:2px}
a{color:#2E7D4F}a:hover{color:#1F5C3A}
.num{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{sy_bg}}; color: #1E2320; font-family: Pretendard, system-ui, sans-serif; letter-spacing: -0.01em; word-break: keep-all; display: flex; flex-direction: column; gap: 14px; padding: 8px 20px 24px; overflow: hidden">

<div style="display: flex; align-items: center; height: 48px">
<button aria-label="뒤로" style="width: 44px; height: 44px; margin-left: -10px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E2320" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<div style="font-size: 17px; font-weight: 600">주문 상세</div>
</div>

<div style="background: #FFFFFF; border: 1px solid #E3E8E2; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; font-size: 13px; color: #5D6660"><span>마루국밥 본점</span><span class="num">12월 9일 12시 31분</span></div>
<div style="display: flex; justify-content: space-between; font-size: 15px"><span>돼지국밥 1개</span><span class="num">9,000원</span></div>
<div style="height: 1px; background: #EEF2EC; margin: 4px 0"></div>
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 15px; font-weight: 600">결제한 금액</span><span class="num" style="font-size: 17px; font-weight: 700">9,000원</span></div>
<div style="display: flex; justify-content: space-between; font-size: 14px; color: #5D6660"><span>결제 수단</span><span>용이 용돈</span></div>
<div style="display: flex; justify-content: space-between; font-size: 14px; color: #5D6660"><span>한 번에 쓸 수 있는 돈</span><span class="num">9,000 / 10,000원</span></div>
<div style="display: flex; justify-content: space-between; font-size: 14px; color: #5D6660"><span>30일 한도</span><span class="num">219,000 / 500,000원</span></div>
</div>

<div style="background: #FFFFFF; border: 1px solid #E3E8E2; border-radius: 20px; overflow: hidden">
<button onClick="{{toggle}}" aria-expanded="{{expanded}}" style="width: 100%; min-height: 52px; border: 0; background: transparent; text-align: left; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 600">자세히 보기<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5D6660" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{chev}}"><path d="M6 9l6 6 6-6"></path></svg></button>
<sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
<div style="padding: 0 16px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 13px">
<div style="display: flex; justify-content: space-between"><span style="color: #5D6660">결제 기록 번호</span><span style="font-family: ui-monospace, Menlo, monospace">0x8f3a…c21e</span></div>
<div style="display: flex; justify-content: space-between"><span style="color: #5D6660">용이 신분증 번호</span><span class="num">1042</span></div>
<div style="display: flex; flex-direction: column; gap: 4px"><span style="color: #5D6660">통과한 마루 규칙 4개</span><span style="font-family: ui-monospace, Menlo, monospace; font-size: 12px; line-height: 1.7; color: #3E4742">AGENT_OKRW_TRANSFER_LIMIT_POLICY<br>PERIODIC_VOLUME_POLICY<br>전역 KYC 한도<br>EAS_POLICY (가게 등록 때)</span></div>
<a href="#" style="font-weight: 600; text-decoration: none; padding: 6px 0">마루 탐색기에서 보기</a>
</div>
</sc-if>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"species": {"editor": "enum", "default": "숲용", "options": ["숲용", "물용", "꽃용", "별용"]}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { open: true }; }
syT() {
const KO = { '숲용': 'forest', '물용': 'water', '꽃용': 'flower', '별용': 'star' };
const T = {
forest: { name: '숲용', accent: '#2E7D4F', bg: '#F6F8F4', tint: '#E4F4E6', dark: '#1F5C3A', body: '#8FD694' },
water: { name: '물용', accent: '#1F6A93', bg: '#F3F7FA', tint: '#E3F1F9', dark: '#154A68', body: '#9AD3F0' },
flower: { name: '꽃용', accent: '#B03A64', bg: '#FAF4F6', tint: '#FBE6EE', dark: '#7D2846', body: '#F7B7C8' },
star: { name: '별용', accent: '#5F47A8', bg: '#F6F4FA', tint: '#ECE6FA', dark: '#43317A', body: '#C9B8F2' }
};
const raw = (this.state && this.state.picked) || this.props.species || '숲용';
return T[KO[raw] || raw] || T.forest;
}
renderVals() {
const t = this.syT();
const k = Object.keys({ forest: 1, water: 1, flower: 1, star: 1 }).find((x) => t.accent === ({ forest: '#2E7D4F', water: '#1F6A93', flower: '#B03A64', star: '#5F47A8' })[x]);
const show = (x) => (x === k ? 'inline' : 'none');
return Object.assign({}, this.syBase(), { sy_accent: t.accent, sy_bg: t.bg, sy_tint: t.tint, sy_dark: t.dark, sy_name: t.name, dragon: t.body, sy_c_forest: show('forest'), sy_c_water: show('water'), sy_c_flower: show('flower'), sy_c_star: show('star') });
}
syBase() {
const open = this.state.open;
return {
open: open,
expanded: open ? 'true' : 'false',
chev: open ? 'transform: rotate(180deg)' : '',
toggle: () => this.setState({ open: !open })
};
}
}
</script>
</body>
</html>
