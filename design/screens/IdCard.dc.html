</head>
<body>
<x-dc>
<helmet>
<style>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{sy_bg}}; color: #1E2320; font-family: Pretendard, system-ui, sans-serif; letter-spacing: -0.01em; word-break: keep-all; display: flex; flex-direction: column; gap: 20px; padding: 8px 20px 24px; overflow: hidden">

<div style="font-size: 17px; font-weight: 600">용이 신분증</div>
</div>

<div style="background: {{dragon}}; border: 1.5px solid #1E2320; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; gap: 14px; align-items: center">
<div style="width: 76px; height: 76px; border-radius: 18px; background: #FFFDF6; border: 1.5px solid #1E2320; display: flex; align-items: center; justify-content: center; flex-shrink: 0">

" stroke-linejoin="round"></path><path d="M49 13 L49.8 15 L51.8 15.2 L50.3 16.5 L50.8 18.5 L49 17.4 L47.2 18.5 L47.7 16.5 L46.2 15.2 L48.2 15 Z" fill="#FFD15C"></path><path d="M15 15 L15.5 16.3 L16.8 16.4 L15.8 17.2 L16.1 18.5 L15 17.8 L13.9 18.5 L14.2 17.2 L13.2 16.4 L14.5 16.3 Z" fill="#FFD15C"></path></g><circle cx="26" cy="29" r="2.4" fill="#1E2320"></circle><circle cx="38" cy="29" r="2.4" fill="#1E2320"></circle><ellipse cx="21.5" cy="34" rx="2.8" ry="1.7" fill="#FF9E9E"></ellipse><ellipse cx="42.5" cy="34" rx="2.8" ry="1.7" fill="#FF9E9E"></ellipse><path d="M30 34.5 Q32 36.5 34 34.5" fill="none" stroke="#1E2320" stroke-width="1.6" stroke-linecap="round"></path><path d="M8 38 L14 33 L20 38 L26 33 L32 38 L38 33 L44 38 L50 33 L56 38 C56 52 46 60 32 60 C18 60 8 52 8 38 Z" fill="#FFFDF6" stroke="#1E2320" stroke-width="2" stroke-linejoin="round"></path></svg>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 24px; font-weight: 700; letter-spacing: -0.02em">용이</span>
<span style="font-size: 15px">이호재님의 배달 비서</span>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px; font-size: 13px">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="color: #2F4A35">한 번에</span><span class="num" style="font-size: 16px; font-weight: 600">10,000원까지</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="color: #2F4A35">주인</span><span style="font-size: 16px; font-weight: 600">실명 확인됨</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="color: #2F4A35">태어난 날</span><span class="num" style="font-size: 16px; font-weight: 600">2026. 12. 1.</span></div>
</div>
</div>

<p style="margin: 0; font-size: 14px; color: #5D6660; text-align: center">가게는 주문을 받을 때 이 신분증을 봐요</p>

<div style="flex-grow: 1"></div>
<button style="height: 52px; border: 1px solid #D5DDD3; border-radius: 18px; background: #FFFFFF; font-size: 15px; font-weight: 600">신분증 공유하기</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"species": {"editor": "enum", "default": "숲용", "options": ["숲용", "물용", "꽃용", "별용"]}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
syT() {
const KO = { '숲용': 'forest', '물용': 'water', '꽃용': 'flower', '별용': 'star' };
const T = {
forest: { name: '숲용', accent: '#2E7D4F', bg: '#F6F8F4', tint: '#E4F4E6', dark: '#1F5C3A', body: '#8FD694' },
water: { name: '물용', accent: '#1F6A93', bg: '#F3F7FA', tint: '#E3F1F9', dark: '#154A68', body: '#9AD3F0' },
flower: { name: '꽃용', accent: '#B03A64', bg: '#FAF4F6', tint: '#FBE6EE', dark: '#7D2846', body: '#F7B7C8' },
star: { name: '별용', accent: '#5F47A8', bg: '#F6F4FA', tint: '#ECE6FA', dark: '#43317A', body: '#C9B8F2' }
};
const raw = (this.state && this.state.picked) || this.props.species || '숲용';
return T[KO[raw] || raw] || T.forest;
}
renderVals() {
const t = this.syT();
const k = Object.keys({ forest: 1, water: 1, flower: 1, star: 1 }).find((x) => t.accent === ({ forest: '#2E7D4F', water: '#1F6A93', flower: '#B03A64', star: '#5F47A8' })[x]);
const show = (x) => (x === k ? 'inline' : 'none');
return Object.assign({}, this.syBase(), { sy_accent: t.accent, sy_bg: t.bg, sy_tint: t.tint, sy_dark: t.dark, sy_name: t.name, dragon: t.body, sy_c_forest: show('forest'), sy_c_water: show('water'), sy_c_flower: show('flower'), sy_c_star: show('star') });
}
syBase() {
return { dragon: this.props.dragon ?? '#8FD694' };
}
}
</script>
</body>
</html>
