<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>시켜용 한도 초과</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&amp;display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Pretendard";src:url(/_blob/595108c608f096ad66f6d78ef534a70e) format("woff2");font-weight:45 920;font-display:swap}
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #2E7D4F;outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{sy_bg}}; color: #1E2320; font-family: Pretendard, system-ui, sans-serif; letter-spacing: -0.01em; word-break: keep-all; display: flex; flex-direction: column; gap: 20px; padding: 8px 20px 28px; overflow: hidden">

<div style="display: flex; align-items: center; height: 48px">
<button aria-label="대화로 돌아가기" style="width: 44px; height: 44px; margin-left: -10px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E2320" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 16px; padding-top: 8px">
<svg width="128" height="128" viewBox="0 0 64 64" aria-hidden="true"><g style="display: {{sy_c_forest}}"><g transform="translate(0 11)"><path d="M27 15 C21 12 20 5 25 2 C29 5 30 11 27 15 Z" fill="#5DBB6A" stroke="#1E2320" stroke-width="1.6" stroke-linejoin="round"></path><path d="M26.5 13 L25 5" stroke="#1E2320" stroke-width="0.8" stroke-linecap="round"></path></g><g transform="translate(0 11)"><path d="M37 15 C43 12 44 5 39 2 C35 5 34 11 37 15 Z" fill="#5DBB6A" stroke="#1E2320" stroke-width="1.6" stroke-linejoin="round"></path><path d="M37.5 13 L39 5" stroke="#1E2320" stroke-width="0.8" stroke-linecap="round"></path></g></g><g transform="translate(32 40) scale(0.94) translate(-32 -30)"><g style="display: {{sy_c_water}}"><path d="M18 25 L7 18 L11 28 L7 37 L18 33 Z" fill="#6FB8E0" stroke="#1E2320" stroke-width="1.6" stroke-linejoin="round"></path><path d="M46 25 L57 18 L53 28 L57 37 L46 33 Z" fill="#6FB8E0" stroke="#1E2320" stroke-width="1.6" stroke-linejoin="round"></path></g><g style="display: {{sy_c_flower}}"><circle cx="19" cy="18" r="6" fill="#F49AB2" stroke="#1E2320" stroke-width="1.6"></circle><circle cx="45" cy="18" r="6" fill="#F49AB2" stroke="#1E2320" stroke-width="1.6"></circle></g></g><circle cx="32" cy="40" r="15" fill="{{dragon}}" stroke="#1E2320" stroke-width="1.6"></circle><g transform="translate(32 40) scale(0.94) translate(-32 -30)"><g style="display: {{sy_c_water}}"><path d="M32 15 C34.2 18.5 35.2 20 35.2 21.6 A3.2 3.2 0 0 1 28.8 21.6 C28.8 20 29.8 18.5 32 15 Z" fill="#FFFFFF" stroke="#1E2320" stroke-width="1.04" stroke-linejoin="round"></path></g><g style="display: {{sy_c_flower}}"><g fill="#FFFFFF" stroke="#1E2320" stroke-width="1.04"><circle cx="32" cy="10.4" r="2.6"></circle><circle cx="35.2" cy="12.8" r="2.6"></circle><circle cx="34" cy="16.4" r="2.6"></circle><circle cx="30" cy="16.4" r="2.6"></circle><circle cx="28.8" cy="12.8" r="2.6"></circle></g><circle cx="32" cy="13.8" r="2" fill="#FFD15C" stroke="#1E2320" stroke-width="1.04"></circle></g><g style="display: {{sy_c_star}}"><path d="M32 3 L33.76 7.57 L38.66 7.84 L34.85 10.93 L36.11 15.66 L32 13 L27.89 15.66 L29.15 10.93 L25.34 7.84 L30.24 7.57 Z" fill="#FFD15C" stroke="#1E2320" stroke-width="1.6" stroke-linejoin="round"></path><path d="M49 13 L49.8 15 L51.8 15.2 L50.3 16.5 L50.8 18.5 L49 17.4 L47.2 18.5 L47.7 16.5 L46.2 15.2 L48.2 15 Z" fill="#FFD15C"></path><path d="M15 15 L15.5 16.3 L16.8 16.4 L15.8 17.2 L16.1 18.5 L15 17.8 L13.9 18.5 L14.2 17.2 L13.2 16.4 L14.5 16.3 Z" fill="#FFD15C"></path></g></g><path d="M23.5 29.5 L28 30.5" stroke="#1E2320" stroke-width="1.4" stroke-linecap="round"></path><path d="M40.5 29.5 L36 30.5" stroke="#1E2320" stroke-width="1.4" stroke-linecap="round"></path><circle cx="26.5" cy="33" r="2.2" fill="#1E2320"></circle><circle cx="37.5" cy="33" r="2.2" fill="#1E2320"></circle><path d="M47 18 C49 21 50 22.5 50 24 A3 3 0 0 1 44 24 C44 22.5 45 21 47 18 Z" fill="#BFE3F7" stroke="#1E2320" stroke-width="1.2" stroke-linejoin="round"></path><path d="M8 36 L14 32 L20 36.5 L26 32.5 L32 37 L38 32.5 L44 36.5 L50 32 L56 36 C56 51 46 60 32 60 C18 60 8 51 8 36 Z" fill="#FFFDF6" stroke="#1E2320" stroke-width="1.6" stroke-linejoin="round"></path></svg>
<p style="margin: 0; text-align: center; font-family: 'Gowun Dodum', Pretendard, sans-serif; font-size: 19px; line-height: 1.55; letter-spacing: 0">앗, 보쌈 대(大)는<br>제가 한 번에 쓸 수 있는 돈보다 커용.</p>
</div>

<div style="display: flex; justify-content: center; align-items: baseline; gap: 10px; padding-top: 4px">
<span class="num" style="font-size: 36px; font-weight: 700; letter-spacing: -0.03em; color: #9A5B00">45,000원</span>
<span class="num" style="font-size: 16px; color: #5D6660">/ 10,000원까지</span>
</div>

<div style="flex-grow: 1"></div>

<div style="display: flex; flex-direction: column; gap: 8px">
<button style="min-height: 64px; border: 0; border-radius: 18px; background: {{sy_accent}}; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px 16px">
<span style="font-size: 17px; font-weight: 700">한 번에 45,000원으로 올리고 시키기</span>
<span class="num" style="font-size: 13px; color: #CFEBD6">한 번에 50,000원까지</span>
</button>
<button style="height: 52px; border: 1px solid #D5DDD3; border-radius: 18px; background: #FFFFFF; font-size: 15px; font-weight: 600">10,000원 안에서 다시 고르기</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"species": {"editor": "enum", "default": "숲용", "options": ["숲용", "물용", "꽃용", "별용"]}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
syT() {
const KO = { '숲용': 'forest', '물용': 'water', '꽃용': 'flower', '별용': 'star' };
const T = {
forest: { name: '숲용', accent: '#2E7D4F', bg: '#F6F8F4', tint: '#E4F4E6', dark: '#1F5C3A', body: '#8FD694' },
water: { name: '물용', accent: '#1F6A93', bg: '#F3F7FA', tint: '#E3F1F9', dark: '#154A68', body: '#9AD3F0' },
flower: { name: '꽃용', accent: '#B03A64', bg: '#FAF4F6', tint: '#FBE6EE', dark: '#7D2846', body: '#F7B7C8' },
star: { name: '별용', accent: '#5F47A8', bg: '#F6F4FA', tint: '#ECE6FA', dark: '#43317A', body: '#C9B8F2' }
};
const raw = (this.state && this.state.picked) || this.props.species || '숲용';
return T[KO[raw] || raw] || T.forest;
}
renderVals() {
const t = this.syT();
const k = Object.keys({ forest: 1, water: 1, flower: 1, star: 1 }).find((x) => t.accent === ({ forest: '#2E7D4F', water: '#1F6A93', flower: '#B03A64', star: '#5F47A8' })[x]);
const show = (x) => (x === k ? 'inline' : 'none');
return Object.assign({}, this.syBase(), { sy_accent: t.accent, sy_bg: t.bg, sy_tint: t.tint, sy_dark: t.dark, sy_name: t.name, dragon: t.body, sy_c_forest: show('forest'), sy_c_water: show('water'), sy_c_flower: show('flower'), sy_c_star: show('star') });
}
syBase() {
return { dragon: this.props.dragon ?? '#8FD694' };
}
}
</script>
</body>
</html>
