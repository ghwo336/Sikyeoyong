<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>시켜용 한도 정하기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&amp;display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Pretendard";src:url(/_blob/595108c608f096ad66f6d78ef534a70e) format("woff2");font-weight:45 920;font-display:swap}
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #2E7D4F;outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{sy_bg}}; color: #1E2320; font-family: Pretendard, system-ui, sans-serif; letter-spacing: -0.01em; word-break: keep-all; display: flex; flex-direction: column; gap: 22px; padding: 8px 20px 32px; overflow: hidden">

<div style="display: flex; align-items: center; gap: 8px; height: 48px">
<div style="width: 34px"></div>
<div style="flex-grow: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px" aria-label="3단계 중 3단계">
<div style="height: 4px; border-radius: 2px; background: {{sy_accent}}"></div>
<div style="height: 4px; border-radius: 2px; background: {{sy_accent}}"></div>
<div style="height: 4px; border-radius: 2px; background: {{sy_accent}}"></div>
</div>
</div>

<div style="display: flex; gap: 14px; align-items: center">
<svg width="{{size}}" height="{{size}}" viewBox="0 0 64 64" aria-hidden="true" style="flex-shrink: 0; transition: width 240ms cubic-bezier(.2,.8,.2,1), height 240ms cubic-bezier(.2,.8,.2,1)"><path d="M10 26 C4 22 4 14 8 12 C10 18 14 20 18 22 Z" fill="{{dragon}}" stroke="#1E2320" stroke-width="1.8" stroke-linejoin="round"></path><path d="M54 26 C60 22 60 14 56 12 C54 18 50 20 46 22 Z" fill="{{dragon}}" stroke="#1E2320" stroke-width="1.8" stroke-linejoin="round"></path><g style="display: {{sy_c_forest}}"><g><path d="M27 15 C21 12 20 5 25 2 C29 5 30 11 27 15 Z" fill="#5DBB6A" stroke="#1E2320" stroke-width="1.8" stroke-linejoin="round"></path><path d="M26.5 13 L25 5" stroke="#1E2320" stroke-width="0.9" stroke-linecap="round"></path></g><g><path d="M37 15 C43 12 44 5 39 2 C35 5 34 11 37 15 Z" fill="#5DBB6A" stroke="#1E2320" stroke-width="1.8" stroke-linejoin="round"></path><path d="M37.5 13 L39 5" stroke="#1E2320" stroke-width="0.9" stroke-linecap="round"></path></g></g><g style="display: {{sy_c_water}}"><path d="M18 25 L7 18 L11 28 L7 37 L18 33 Z" fill="#6FB8E0" stroke="#1E2320" stroke-width="1.8" stroke-linejoin="round"></path><path d="M46 25 L57 18 L53 28 L57 37 L46 33 Z" fill="#6FB8E0" stroke="#1E2320" stroke-width="1.8" stroke-linejoin="round"></path></g><g style="display: {{sy_c_flower}}"><circle cx="19" cy="18" r="6" fill="#F49AB2" stroke="#1E2320" stroke-width="1.8"></circle><circle cx="45" cy="18" r="6" fill="#F49AB2" stroke="#1E2320" stroke-width="1.8"></circle></g><circle cx="32" cy="30" r="16" fill="{{dragon}}" stroke="#1E2320" stroke-width="1.8"></circle><g style="display: {{sy_c_water}}"><path d="M32 15 C34.2 18.5 35.2 20 35.2 21.6 A3.2 3.2 0 0 1 28.8 21.6 C28.8 20 29.8 18.5 32 15 Z" fill="#FFFFFF" stroke="#1E2320" stroke-width="1.17" stroke-linejoin="round"></path></g><g style="display: {{sy_c_flower}}"><g fill="#FFFFFF" stroke="#1E2320" stroke-width="1.17"><circle cx="32" cy="10.4" r="2.6"></circle><circle cx="35.2" cy="12.8" r="2.6"></circle><circle cx="34" cy="16.4" r="2.6"></circle><circle cx="30" cy="16.4" r="2.6"></circle><circle cx="28.8" cy="12.8" r="2.6"></circle></g><circle cx="32" cy="13.8" r="2" fill="#FFD15C" stroke="#1E2320" stroke-width="1.17"></circle></g><g style="display: {{sy_c_star}}"><path d="M32 3 L33.76 7.57 L38.66 7.84 L34.85 10.93 L36.11 15.66 L32 13 L27.89 15.66 L29.15 10.93 L25.34 7.84 L30.24 7.57 Z" fill="#FFD15C" stroke="#1E2320" stroke-width="1.8" stroke-linejoin="round"></path><path d="M49 13 L49.8 15 L51.8 15.2 L50.3 16.5 L50.8 18.5 L49 17.4 L47.2 18.5 L47.7 16.5 L46.2 15.2 L48.2 15 Z" fill="#FFD15C"></path><path d="M15 15 L15.5 16.3 L16.8 16.4 L15.8 17.2 L16.1 18.5 L15 17.8 L13.9 18.5 L14.2 17.2 L13.2 16.4 L14.5 16.3 Z" fill="#FFD15C"></path></g><circle cx="26" cy="29" r="2.4" fill="#1E2320"></circle><circle cx="38" cy="29" r="2.4" fill="#1E2320"></circle><circle cx="26.8" cy="28.2" r="0.8" fill="#FFFFFF"></circle><circle cx="38.8" cy="28.2" r="0.8" fill="#FFFFFF"></circle><ellipse cx="21.5" cy="34" rx="2.8" ry="1.7" fill="#FF9E9E"></ellipse><ellipse cx="42.5" cy="34" rx="2.8" ry="1.7" fill="#FF9E9E"></ellipse><path d="M29.5 33.5 Q32 37 34.5 33.5" fill="none" stroke="#1E2320" stroke-width="1.6" stroke-linecap="round"></path><path d="M8 38 L14 33 L20 38 L26 33 L32 38 L38 33 L44 38 L50 33 L56 38 C56 52 46 60 32 60 C18 60 8 52 8 38 Z" fill="#FFFDF6" stroke="#1E2320" stroke-width="1.8" stroke-linejoin="round"></path></svg>
<p style="margin: 0; font-family: 'Gowun Dodum', Pretendard, sans-serif; font-size: 20px; line-height: 1.5; letter-spacing: 0">안녕하세용!<br>용이예용. 얼마까지 맡겨 줄래용?</p>
</div>

<sc-for list="{{rows}}" as="r" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 15px; font-weight: 600">{{r.title}}</div>
<div style="display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 8px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E3E8E2" role="group" aria-label="{{r.title}}">
<button aria-label="{{r.lessLabel}}" onClick="{{r.less}}" disabled="{{r.atMin}}" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: {{sy_tint}}; color: {{sy_dark}}; font-size: 22px; font-weight: 600; opacity: {{r.lessOpacity}}">−</button>
<output class="num" aria-live="polite" style="flex-grow: 1; text-align: center; font-size: 24px; font-weight: 700">{{r.value}}</output>
<button aria-label="{{r.moreLabel}}" onClick="{{r.more}}" disabled="{{r.atMax}}" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: {{sy_tint}}; color: {{sy_dark}}; font-size: 22px; font-weight: 600; opacity: {{r.moreOpacity}}">+</button>
</div>
</div>
</sc-for>

<div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #E3E8E2; padding-top: 18px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 600">체험용 용돈</span>
<span class="num" style="font-size: 13px; color: #5D6660">100,000원</span>
</div>
<button style="height: 44px; padding: 0 18px; border: 1px solid {{sy_accent}}; border-radius: 22px; background: #FFFFFF; color: {{sy_accent}}; font-size: 15px; font-weight: 600">받기</button>
</div>

<div style="flex-grow: 1"></div>
<button style="height: 56px; border: 0; border-radius: 18px; background: {{sy_accent}}; color: #FFFFFF; font-size: 17px; font-weight: 700">용이랑 시작하기</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"species": {"editor": "enum", "default": "숲용", "options": ["숲용", "물용", "꽃용", "별용"]}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { perOrder: 10000, period: 300000 }; }
syT() {
const KO = { '숲용': 'forest', '물용': 'water', '꽃용': 'flower', '별용': 'star' };
const T = {
forest: { name: '숲용', accent: '#2E7D4F', bg: '#F6F8F4', tint: '#E4F4E6', dark: '#1F5C3A', body: '#8FD694' },
water: { name: '물용', accent: '#1F6A93', bg: '#F3F7FA', tint: '#E3F1F9', dark: '#154A68', body: '#9AD3F0' },
flower: { name: '꽃용', accent: '#B03A64', bg: '#FAF4F6', tint: '#FBE6EE', dark: '#7D2846', body: '#F7B7C8' },
star: { name: '별용', accent: '#5F47A8', bg: '#F6F4FA', tint: '#ECE6FA', dark: '#43317A', body: '#C9B8F2' }
};
const raw = (this.state && this.state.picked) || this.props.species || '숲용';
return T[KO[raw] || raw] || T.forest;
}
renderVals() {
const t = this.syT();
const k = Object.keys({ forest: 1, water: 1, flower: 1, star: 1 }).find((x) => t.accent === ({ forest: '#2E7D4F', water: '#1F6A93', flower: '#B03A64', star: '#5F47A8' })[x]);
const show = (x) => (x === k ? 'inline' : 'none');
return Object.assign({}, this.syBase(), { sy_accent: t.accent, sy_bg: t.bg, sy_tint: t.tint, sy_dark: t.dark, sy_name: t.name, dragon: t.body, sy_c_forest: show('forest'), sy_c_water: show('water'), sy_c_flower: show('flower'), sy_c_star: show('star') });
}
syBase() {
// D-31: two amounts instead of budget chips; the dragon grows with the per-order amount.
const won = (v) => v.toLocaleString('ko-KR') + '원';
const stage = this.state.perOrder <= 10000 ? 1 : this.state.perOrder <= 30000 ? 2 : 3;
const row = (key, title, min, max, step) => {
const v = this.state[key];
const set = (n) => this.setState({ [key]: Math.min(max, Math.max(min, n)) });
return {
title, value: won(v),
lessLabel: title + ' ' + won(step) + ' 내리기', moreLabel: title + ' ' + won(step) + ' 올리기',
less: () => set(v - step), more: () => set(v + step),
atMin: v <= min, atMax: v >= max,
lessOpacity: v <= min ? 0.35 : 1, moreOpacity: v >= max ? 0.35 : 1
};
};
return {
size: [0, 80, 92, 104][stage],
rows: [
row('perOrder', '한 번에 쓸 돈', 5000, 50000, 5000),
row('period', '30일에 쓸 돈', 50000, 500000, 50000)
]
};
}
}
</script>
</body>
</html>
