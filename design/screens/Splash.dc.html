.sy-leaf-l{animation:sy-leaf 1.6s ease-in-out infinite;transform-origin:27px 15px;transform-box:view-box}
.sy-leaf-r{animation:sy-leaf 1.6s ease-in-out infinite reverse;transform-origin:37px 15px;transform-box:view-box}
.sy-dot{animation:sy-dot 1.2s ease-in-out infinite}
.sy-dot:nth-child(2){animation-delay:.15s}
.sy-dot:nth-child(3){animation-delay:.3s}
@media (prefers-reduced-motion:reduce){.sy-bob,.sy-shadow,.sy-leaf-l,.sy-leaf-r,.sy-dot{animation:none}}
</style>
