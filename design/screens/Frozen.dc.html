<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>시켜용 용이 멈춤</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&amp;display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Pretendard";src:url(/_blob/595108c608f096ad66f6d78ef534a70e) format("woff2");font-weight:45 920;font-display:swap}
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #2E7D4F;outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EEF1F4; color: #1E2320; font-family: Pretendard, system-ui, sans-serif; letter-spacing: -0.01em; word-break: keep-all; display: flex; flex-direction: column; gap: 20px; padding: 8px 20px 28px; overflow: hidden">

<div style="display: flex; align-items: center; height: 48px">
<button aria-label="뒤로" style="width: 44px; height: 44px; margin-left: -10px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E2320" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
</div>

<div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px">
<svg width="168" height="168" viewBox="0 0 64 64" aria-hidden="true"><ellipse cx="32" cy="61" rx="15" ry="2" fill="#D9DEE4"></ellipse><path d="M32 8 C44 8 52 26 52 40 C52 52 43 60 32 60 C21 60 12 52 12 40 C12 26 20 8 32 8 Z" fill="#FFFDF6" stroke="#1E2320" stroke-width="1.4"></path><path d="M23.6 38.6 C21.4 36.4 22.2 33.4 25.1 33.4 C25.8 35.6 25.1 37.8 23.6 38.6 Z" fill="{{dragon}}"></path><path d="M39.5 49.3 C36.7 46.5 37.7 42.7 41.4 42.7 C42.3 45.5 41.4 48.3 39.5 49.3 Z" fill="{{dragon}}"></path><path d="M28.7 53.9 C27.1 52.3 27.7 50.1 29.8 50.1 C30.3 51.7 29.8 53.3 28.7 53.9 Z" fill="{{dragon}}"></path><path d="M44 10 H50 L44 16 H50" fill="none" stroke="#5D6660" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path><path d="M53 3 H57 L53 7 H57" fill="none" stroke="#8A938C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
<div style="font-size: 26px; font-weight: 700; letter-spacing: -0.03em">용이가 자고 있어요</div>
<p style="margin: 0; font-size: 15px; color: #5D6660">모든 주문이 멈췄어요</p>
</div>
</div>

<div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #D9DEE4; padding-top: 18px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 600">용이 주머니</span>
<span class="num" style="font-size: 13px; color: #5D6660">20,000원 남음</span>
</div>
<button style="height: 44px; padding: 0 18px; border: 1px solid #1E2320; border-radius: 22px; background: #FFFFFF; font-size: 15px; font-weight: 600">돌려받기</button>
</div>

<button style="height: 56px; border: 0; border-radius: 18px; background: {{sy_accent}}; color: #FFFFFF; font-size: 17px; font-weight: 700">용이 깨우기</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"species": {"editor": "enum", "default": "숲용", "options": ["숲용", "물용", "꽃용", "별용"]}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
syT() {
const KO = { '숲용': 'forest', '물용': 'water', '꽃용': 'flower', '별용': 'star' };
const T = {
forest: { name: '숲용', accent: '#2E7D4F', bg: '#F6F8F4', tint: '#E4F4E6', dark: '#1F5C3A', body: '#8FD694' },
water: { name: '물용', accent: '#1F6A93', bg: '#F3F7FA', tint: '#E3F1F9', dark: '#154A68', body: '#9AD3F0' },
flower: { name: '꽃용', accent: '#B03A64', bg: '#FAF4F6', tint: '#FBE6EE', dark: '#7D2846', body: '#F7B7C8' },
star: { name: '별용', accent: '#5F47A8', bg: '#F6F4FA', tint: '#ECE6FA', dark: '#43317A', body: '#C9B8F2' }
};
const raw = (this.state && this.state.picked) || this.props.species || '숲용';
return T[KO[raw] || raw] || T.forest;
}
renderVals() {
const t = this.syT();
const k = Object.keys({ forest: 1, water: 1, flower: 1, star: 1 }).find((x) => t.accent === ({ forest: '#2E7D4F', water: '#1F6A93', flower: '#B03A64', star: '#5F47A8' })[x]);
const show = (x) => (x === k ? 'inline' : 'none');
return Object.assign({}, this.syBase(), { sy_accent: t.accent, sy_bg: t.bg, sy_tint: t.tint, sy_dark: t.dark, sy_name: t.name, dragon: t.body, sy_c_forest: show('forest'), sy_c_water: show('water'), sy_c_flower: show('flower'), sy_c_star: show('star') });
}
syBase() {
return { dragon: this.props.dragon ?? '#8FD694' };
}
}
</script>
</body>
</html>
