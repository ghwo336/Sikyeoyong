<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>시켜용 내 주문</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&amp;display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Pretendard";src:url(/_blob/595108c608f096ad66f6d78ef534a70e) format("woff2");font-weight:45 920;font-display:swap}
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid #2E7D4F;outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{bg}}; color: #1E2320; font-family: Pretendard, system-ui, sans-serif; letter-spacing: -0.01em; word-break: keep-all; display: flex; flex-direction: column; overflow: hidden">

<div style="display: flex; align-items: center; gap: 4px; padding: 8px 12px 0 10px; height: 56px; flex-shrink: 0">
<a href="Main.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E2320" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div style="flex-grow: 1; font-size: 20px; font-weight: 700; letter-spacing: -0.02em">내 주문</div>
<a href="Main.dc.html" aria-label="용이와 이야기하기" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="36" height="36" viewBox="0 0 64 64" aria-hidden="true" style="flex-shrink: 0"><g style="display: {{sy_c_forest}}"><g><path d="M27 15 C21 12 20 5 25 2 C29 5 30 11 27 15 Z" fill="#5DBB6A" stroke="#1E2320" stroke-width="2" stroke-linejoin="round"></path><path d="M26.5 13 L25 5" stroke="#1E2320" stroke-width="1" stroke-linecap="round"></path></g><g><path d="M37 15 C43 12 44 5 39 2 C35 5 34 11 37 15 Z" fill="#5DBB6A" stroke="#1E2320" stroke-width="2" stroke-linejoin="round"></path><path d="M37.5 13 L39 5" stroke="#1E2320" stroke-width="1" stroke-linecap="round"></path></g></g><g style="display: {{sy_c_water}}"><path d="M18 25 L7 18 L11 28 L7 37 L18 33 Z" fill="#6FB8E0" stroke="#1E2320" stroke-width="2" stroke-linejoin="round"></path><path d="M46 25 L57 18 L53 28 L57 37 L46 33 Z" fill="#6FB8E0" stroke="#1E2320" stroke-width="2" stroke-linejoin="round"></path></g><g style="display: {{sy_c_flower}}"><circle cx="19" cy="18" r="6" fill="#F49AB2" stroke="#1E2320" stroke-width="2"></circle><circle cx="45" cy="18" r="6" fill="#F49AB2" stroke="#1E2320" stroke-width="2"></circle></g><circle cx="32" cy="30" r="16" fill="{{dragon}}" stroke="#1E2320" stroke-width="2"></circle><g style="display: {{sy_c_water}}"><path d="M32 15 C34.2 18.5 35.2 20 35.2 21.6 A3.2 3.2 0 0 1 28.8 21.6 C28.8 20 29.8 18.5 32 15 Z" fill="#FFFFFF" stroke="#1E2320" stroke-width="1.3" stroke-linejoin="round"></path></g><g style="display: {{sy_c_flower}}"><g fill="#FFFFFF" stroke="#1E2320" stroke-width="1.3"><circle cx="32" cy="10.4" r="2.6"></circle><circle cx="35.2" cy="12.8" r="2.6"></circle><circle cx="34" cy="16.4" r="2.6"></circle><circle cx="30" cy="16.4" r="2.6"></circle><circle cx="28.8" cy="12.8" r="2.6"></circle></g><circle cx="32" cy="13.8" r="2" fill="#FFD15C" stroke="#1E2320" stroke-width="1.3"></circle></g><g style="display: {{sy_c_star}}"><path d="M32 3 L33.76 7.57 L38.66 7.84 L34.85 10.93 L36.11 15.66 L32 13 L27.89 15.66 L29.15 10.93 L25.34 7.84 L30.24 7.57 Z" fill="#FFD15C" stroke="#1E2320" stroke-width="2" stroke-linejoin="round"></path><path d="M49 13 L49.8 15 L51.8 15.2 L50.3 16.5 L50.8 18.5 L49 17.4 L47.2 18.5 L47.7 16.5 L46.2 15.2 L48.2 15 Z" fill="#FFD15C"></path><path d="M15 15 L15.5 16.3 L16.8 16.4 L15.8 17.2 L16.1 18.5 L15 17.8 L13.9 18.5 L14.2 17.2 L13.2 16.4 L14.5 16.3 Z" fill="#FFD15C"></path></g><circle cx="26" cy="29" r="2.4" fill="#1E2320"></circle><circle cx="38" cy="29" r="2.4" fill="#1E2320"></circle><circle cx="26.8" cy="28.2" r="0.8" fill="#FFFFFF"></circle><circle cx="38.8" cy="28.2" r="0.8" fill="#FFFFFF"></circle><ellipse cx="21.5" cy="34" rx="2.8" ry="1.7" fill="#FF9E9E"></ellipse><ellipse cx="42.5" cy="34" rx="2.8" ry="1.7" fill="#FF9E9E"></ellipse><path d="M30 34.5 Q32 36.5 34 34.5" fill="none" stroke="#1E2320" stroke-width="1.6" stroke-linecap="round"></path><path d="M8 38 L14 33 L20 38 L26 33 L32 38 L38 33 L44 38 L50 33 L56 38 C56 52 46 60 32 60 C18 60 8 52 8 38 Z" fill="#FFFDF6" stroke="#1E2320" stroke-width="2" stroke-linejoin="round"></path></svg></a>
</div>

<div style="padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 14px; color: #5D6660">30일 배달비</span>
<span class="num" style="font-size: 13px; color: {{accent}}; font-weight: 600">{{saved}}</span>
</div>
<div style="display: flex; align-items: baseline; gap: 6px">
<span class="num" style="font-size: 34px; font-weight: 700; letter-spacing: -0.03em">{{used}}</span>
<span class="num" style="font-size: 15px; color: #5D6660">/ {{cap}}</span>
</div>
<div style="height: 8px; background: #EEF2EC; border-radius: 4px; overflow: hidden"><div style="width: {{pct}}; height: 8px; background: #FFD15C; border-radius: 4px"></div></div>
</div>

<div style="height: 1px; background: #E3E8E2; flex-shrink: 0"></div>

<sc-if value="{{hasOrders}}" hint-placeholder-val="{{ true }}">
<div role="tablist" aria-label="주문 거르기" style="display: flex; gap: 8px; padding: 14px 20px 6px; flex-shrink: 0">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
<button role="tab" aria-selected="{{c.sel}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>

<div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column">
<sc-for list="{{rows}}" as="o" hint-placeholder-count="4">
<div style="padding: 0 20px">
<div style="display: flex; flex-direction: column; gap: 12px; padding: 16px 0; border-bottom: 1px solid #E3E8E2">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 12px; color: #5D6660">{{o.when}}</span>
<span style="{{o.chipStyle}}">{{o.chip}}</span>
</div>
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
<span style="font-size: 13px; color: #5D6660">{{o.store}}</span>
<span style="font-size: 16px; font-weight: 600">{{o.menu}}</span>
</div>
<span class="num" style="font-size: 16px; font-weight: 600">{{o.amount}}</span>
</div>
<div style="display: flex; gap: 8px">
<button aria-disabled="{{o.mainOff}}" style="{{o.mainStyle}}">{{o.mainLabel}}</button>
<sc-if value="{{o.hasRate}}" hint-placeholder-val="{{ true }}">
<button style="height: 40px; padding: 0 14px; border: 1px solid #D5DDD3; border-radius: 20px; background: #FFFFFF; font-size: 14px; color: {{o.rateInk}}">{{o.rateLabel}}</button>
</sc-if>
</div>
</div>
</div>
</sc-for>
</div>
</sc-if>

<sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
<div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 0 32px 64px">
<svg width="120" height="120" viewBox="0 0 64 64" aria-hidden="true" style="flex-shrink: 0"><g style="display: {{sy_c_forest}}"><g><path d="M27 15 C21 12 20 5 25 2 C29 5 30 11 27 15 Z" fill="#5DBB6A" stroke="#1E2320" stroke-width="2" stroke-linejoin="round"></path><path d="M26.5 13 L25 5" stroke="#1E2320" stroke-width="1" stroke-linecap="round"></path></g><g><path d="M37 15 C43 12 44 5 39 2 C35 5 34 11 37 15 Z" fill="#5DBB6A" stroke="#1E2320" stroke-width="2" stroke-linejoin="round"></path><path d="M37.5 13 L39 5" stroke="#1E2320" stroke-width="1" stroke-linecap="round"></path></g></g><g style="display: {{sy_c_water}}"><path d="M18 25 L7 18 L11 28 L7 37 L18 33 Z" fill="#6FB8E0" stroke="#1E2320" stroke-width="2" stroke-linejoin="round"></path><path d="M46 25 L57 18 L53 28 L57 37 L46 33 Z" fill="#6FB8E0" stroke="#1E2320" stroke-width="2" stroke-linejoin="round"></path></g><g style="display: {{sy_c_flower}}"><circle cx="19" cy="18" r="6" fill="#F49AB2" stroke="#1E2320" stroke-width="2"></circle><circle cx="45" cy="18" r="6" fill="#F49AB2" stroke="#1E2320" stroke-width="2"></circle></g><circle cx="32" cy="30" r="16" fill="{{dragon}}" stroke="#1E2320" stroke-width="2"></circle><g style="display: {{sy_c_water}}"><path d="M32 15 C34.2 18.5 35.2 20 35.2 21.6 A3.2 3.2 0 0 1 28.8 21.6 C28.8 20 29.8 18.5 32 15 Z" fill="#FFFFFF" stroke="#1E2320" stroke-width="1.3" stroke-linejoin="round"></path></g><g style="display: {{sy_c_flower}}"><g fill="#FFFFFF" stroke="#1E2320" stroke-width="1.3"><circle cx="32" cy="10.4" r="2.6"></circle><circle cx="35.2" cy="12.8" r="2.6"></circle><circle cx="34" cy="16.4" r="2.6"></circle><circle cx="30" cy="16.4" r="2.6"></circle><circle cx="28.8" cy="12.8" r="2.6"></circle></g><circle cx="32" cy="13.8" r="2" fill="#FFD15C" stroke="#1E2320" stroke-width="1.3"></circle></g><g style="display: {{sy_c_star}}"><path d="M32 3 L33.76 7.57 L38.66 7.84 L34.85 10.93 L36.11 15.66 L32 13 L27.89 15.66 L29.15 10.93 L25.34 7.84 L30.24 7.57 Z" fill="#FFD15C" stroke="#1E2320" stroke-width="2" stroke-linejoin="round"></path><path d="M49 13 L49.8 15 L51.8 15.2 L50.3 16.5 L50.8 18.5 L49 17.4 L47.2 18.5 L47.7 16.5 L46.2 15.2 L48.2 15 Z" fill="#FFD15C"></path><path d="M15 15 L15.5 16.3 L16.8 16.4 L15.8 17.2 L16.1 18.5 L15 17.8 L13.9 18.5 L14.2 17.2 L13.2 16.4 L14.5 16.3 Z" fill="#FFD15C"></path></g><circle cx="26" cy="29" r="2.4" fill="#1E2320"></circle><circle cx="38" cy="29" r="2.4" fill="#1E2320"></circle><circle cx="26.8" cy="28.2" r="0.8" fill="#FFFFFF"></circle><circle cx="38.8" cy="28.2" r="0.8" fill="#FFFFFF"></circle><ellipse cx="21.5" cy="34" rx="2.8" ry="1.7" fill="#FF9E9E"></ellipse><ellipse cx="42.5" cy="34" rx="2.8" ry="1.7" fill="#FF9E9E"></ellipse><path d="M30 34.5 Q32 36.5 34 34.5" fill="none" stroke="#1E2320" stroke-width="1.6" stroke-linecap="round"></path><path d="M8 38 L14 33 L20 38 L26 33 L32 38 L38 33 L44 38 L50 33 L56 38 C56 52 46 60 32 60 C18 60 8 52 8 38 Z" fill="#FFFDF6" stroke="#1E2320" stroke-width="2" stroke-linejoin="round"></path></svg>
<p style="margin: 0; font-family: 'Gowun Dodum', Pretendard, sans-serif; font-size: 18px; line-height: 1.6; letter-spacing: 0; text-align: center">아직 시킨 게 없어용. 뭐 먹고 싶어용?</p>
<a href="Main.dc.html" style="height: 48px; padding: 0 24px; border-radius: 24px; background: {{accent}}; color: #FFFFFF; font-size: 15px; font-weight: 600; display: flex; align-items: center; text-decoration: none">용이에게 말하기</a>
</div>
</sc-if>

<sc-if value="{{asleep}}" hint-placeholder-val="{{ false }}">
<div style="padding: 14px 20px 28px; border-top: 1px solid #D9DEE4; display: flex; align-items: center; gap: 12px; flex-shrink: 0; background: #EEF1F4">
<span style="flex-grow: 1; font-family: 'Gowun Dodum', Pretendard, sans-serif; font-size: 16px; letter-spacing: 0">용이가 자고 있어용</span>
<a href="Frozen.dc.html" style="height: 40px; padding: 0 16px; border: 1px solid #1E2320; border-radius: 20px; background: #FFFFFF; font-size: 14px; font-weight: 600; display: flex; align-items: center; text-decoration: none; color: #1E2320">깨우기</a>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"species": {"editor": "enum", "default": "숲용", "options": ["숲용", "물용", "꽃용", "별용"]}, "view": {"editor": "enum", "default": "주문 많음", "options": ["주문 많음", "비어 있음", "허락 기다림", "멈춘 용"]}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { filter: 'all' }; }
syT() {
const KO = { '숲용': 'forest', '물용': 'water', '꽃용': 'flower', '별용': 'star' };
const T = {
forest: { name: '숲용', accent: '#2E7D4F', bg: '#F6F8F4', tint: '#E4F4E6', dark: '#1F5C3A', body: '#8FD694' },
water: { name: '물용', accent: '#1F6A93', bg: '#F3F7FA', tint: '#E3F1F9', dark: '#154A68', body: '#9AD3F0' },
flower: { name: '꽃용', accent: '#B03A64', bg: '#FAF4F6', tint: '#FBE6EE', dark: '#7D2846', body: '#F7B7C8' },
star: { name: '별용', accent: '#5F47A8', bg: '#F6F4FA', tint: '#ECE6FA', dark: '#43317A', body: '#C9B8F2' }
};
const raw = (this.state && this.state.picked) || this.props.species || '숲용';
return T[KO[raw] || raw] || T.forest;
}
renderVals() {
const t = this.syT();
const k = Object.keys({ forest: 1, water: 1, flower: 1, star: 1 }).find((x) => t.accent === ({ forest: '#2E7D4F', water: '#1F6A93', flower: '#B03A64', star: '#5F47A8' })[x]);
const show = (x) => (x === k ? 'inline' : 'none');
const view = this.props.view || '주문 많음';
const asleep = view === '멈춘 용';
const empty = view === '비어 있음';
const f = this.state.filter;
const chipBase = 'height: 36px; padding: 0 14px; border-radius: 999px; font-size: 14px; ';
const chip = (key, label) => ({
label, sel: f === key ? 'true' : 'false',
pick: () => this.setState({ filter: key }),
style: chipBase + (f === key ? 'border: 1px solid ' + t.accent + '; background: ' + t.accent + '; color: #FFFFFF; font-weight: 600' : 'border: 1px solid #D5DDD3; background: #FFFFFF; color: #1E2320')
});
const CH = {
done: 'font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; color: ' + t.dark + '; background: ' + t.tint,
stop: 'font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; color: #5D6660; background: #EEF2EC',
wait: 'font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; color: #6B4E00; background: #FFF1C7'
};
const base = [
{ kind: 'done', when: '오늘 오후 12:31', store: '마루국밥 본점', menu: '돼지국밥', amount: '9,000원', rate: '또 먹을래' },
{ kind: 'done', when: '어제 오후 7:02', store: '대청분식', menu: '어묵탕과 김밥', amount: '8,500원', rate: '' },
{ kind: 'stop', when: '11월 18일 오후 6:40', store: '한상보쌈', menu: '보쌈 정식', amount: '12,000원', rate: '' },
{ kind: 'done', when: '11월 15일 오후 12:10', store: '마루국밥 본점', menu: '순대국', amount: '9,500원', rate: '괜찮았어' }
];
if (view === '허락 기다림') base.unshift({ kind: 'wait', when: '방금', store: '한상보쌈', menu: '보쌈 정식', amount: '12,000원', rate: '' });
const label = { done: '배달 완료', stop: '멈춤', wait: '허락 기다리는 중' };
const list = empty ? [] : base.filter((o) => f === 'all' || (f === 'done' && o.kind === 'done') || (f === 'stop' && o.kind === 'stop'));
const rows = list.map((o) => {
const pending = o.kind === 'wait';
const off = asleep && !pending;
return {
when: o.when, store: o.store, menu: o.menu, amount: o.amount,
chip: label[o.kind], chipStyle: CH[o.kind],
mainLabel: pending ? '확인하기' : '재주문',
mainOff: off ? 'true' : 'false',
mainStyle: 'height: 40px; padding: 0 18px; border-radius: 20px; font-size: 14px; font-weight: 600; ' + (pending ? 'border: 0; background: ' + t.accent + '; color: #FFFFFF' : 'border: 1px solid #1E2320; background: #FFFFFF; color: #1E2320') + (off ? '; opacity: 0.4' : ''),
hasRate: o.kind === 'done',
rateLabel: o.rate ? o.rate : '맛 평가',
rateInk: o.rate ? t.accent : '#1E2320'
};
});
return {
sy_accent: t.accent, accent: t.accent, bg: asleep ? '#EEF1F4' : t.bg, sy_c_forest: show('forest'), sy_c_water: show('water'), sy_c_flower: show('flower'), sy_c_star: show('star'),
used: empty ? '0원' : '219,000원', cap: '300,000원', pct: empty ? '0%' : '73%',
saved: empty ? '' : '이번 달 32,000원 아꼈어요',
chips: [chip('all', '전체'), chip('done', '배달 완료'), chip('stop', '멈춤')],
rows, hasOrders: !empty, isEmpty: empty, asleep
};
}
}
</script>
</body>
</html>
