<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>시켜용 주문 확인</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&amp;display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Pretendard";src:url(/_blob/595108c608f096ad66f6d78ef534a70e) format("woff2");font-weight:45 920;font-display:swap}
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #2E7D4F;outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{sy_bg}}; color: #1E2320; font-family: Pretendard, system-ui, sans-serif; letter-spacing: -0.01em; word-break: keep-all; display: flex; flex-direction: column; overflow: hidden; position: relative">

<div style="flex-grow: 1; background: #1E2320; opacity: 0.38"></div>

<div role="dialog" aria-label="주문 확인" style="background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 10px 20px 28px; display: flex; flex-direction: column; gap: 20px">
<div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #D5DDD3"></div>

<div style="display: flex; gap: 12px; align-items: center">
<svg width="44" height="44" viewBox="0 0 64 64" aria-hidden="true" style="flex-shrink: 0"><g style="display: {{sy_c_forest}}"><g><path d="M27 15 C21 12 20 5 25 2 C29 5 30 11 27 15 Z" fill="#5DBB6A" stroke="#1E2320" stroke-width="2" stroke-linejoin="round"></path><path d="M26.5 13 L25 5" stroke="#1E2320" stroke-width="1" stroke-linecap="round"></path></g><g><path d="M37 15 C43 12 44 5 39 2 C35 5 34 11 37 15 Z" fill="#5DBB6A" stroke="#1E2320" stroke-width="2" stroke-linejoin="round"></path><path d="M37.5 13 L39 5" stroke="#1E2320" stroke-width="1" stroke-linecap="round"></path></g></g><g style="display: {{sy_c_water}}"><path d="M18 25 L7 18 L11 28 L7 37 L18 33 Z" fill="#6FB8E0" stroke="#1E2320" stroke-width="2" stroke-linejoin="round"></path><path d="M46 25 L57 18 L53 28 L57 37 L46 33 Z" fill="#6FB8E0" stroke="#1E2320" stroke-width="2" stroke-linejoin="round"></path></g><g style="display: {{sy_c_flower}}"><circle cx="19" cy="18" r="6" fill="#F49AB2" stroke="#1E2320" stroke-width="2"></circle><circle cx="45" cy="18" r="6" fill="#F49AB2" stroke="#1E2320" stroke-width="2"></circle></g><circle cx="32" cy="30" r="16" fill="{{dragon}}" stroke="#1E2320" stroke-width="2"></circle><g style="display: {{sy_c_water}}"><path d="M32 15 C34.2 18.5 35.2 20 35.2 21.6 A3.2 3.2 0 0 1 28.8 21.6 C28.8 20 29.8 18.5 32 15 Z" fill="#FFFFFF" stroke="#1E2320" stroke-width="1.3" stroke-linejoin="round"></path></g><g style="display: {{sy_c_flower}}"><g fill="#FFFFFF" stroke="#1E2320" stroke-width="1.3"><circle cx="32" cy="10.4" r="2.6"></circle><circle cx="35.2" cy="12.8" r="2.6"></circle><circle cx="34" cy="16.4" r="2.6"></circle><circle cx="30" cy="16.4" r="2.6"></circle><circle cx="28.8" cy="12.8" r="2.6"></circle></g><circle cx="32" cy="13.8" r="2" fill="#FFD15C" stroke="#1E2320" stroke-width="1.3"></circle></g><g style="display: {{sy_c_star}}"><path d="M32 3 L33.76 7.57 L38.66 7.84 L34.85 10.93 L36.11 15.66 L32 13 L27.89 15.66 L29.15 10.93 L25.34 7.84 L30.24 7.57 Z" fill="#FFD15C" stroke="#1E2320" stroke-width="2" stroke-linejoin="round"></path><path d="M49 13 L49.8 15 L51.8 15.2 L50.3 16.5 L50.8 18.5 L49 17.4 L47.2 18.5 L47.7 16.5 L46.2 15.2 L48.2 15 Z" fill="#FFD15C"></path><path d="M15 15 L15.5 16.3 L16.8 16.4 L15.8 17.2 L16.1 18.5 L15 17.8 L13.9 18.5 L14.2 17.2 L13.2 16.4 L14.5 16.3 Z" fill="#FFD15C"></path></g><path d="M23.5 29 Q26 26.5 28.5 29" fill="none" stroke="#1E2320" stroke-width="2" stroke-linecap="round"></path><path d="M35.5 29 Q38 26.5 40.5 29" fill="none" stroke="#1E2320" stroke-width="2" stroke-linecap="round"></path><ellipse cx="21.5" cy="34" rx="2.8" ry="1.7" fill="#FF9E9E"></ellipse><ellipse cx="42.5" cy="34" rx="2.8" ry="1.7" fill="#FF9E9E"></ellipse><path d="M29.5 33.5 Q32 36.5 34.5 33.5" fill="none" stroke="#1E2320" stroke-width="1.6" stroke-linecap="round"></path><path d="M8 38 L14 33 L20 38 L26 33 L32 38 L38 33 L44 38 L50 33 L56 38 C56 52 46 60 32 60 C18 60 8 52 8 38 Z" fill="#FFFDF6" stroke="#1E2320" stroke-width="2" stroke-linejoin="round"></path></svg>
<p style="margin: 0; font-family: 'Gowun Dodum', Pretendard, sans-serif; font-size: 18px; line-height: 1.5; letter-spacing: 0">돼지국밥 시킬게용.<br>이대로 괜찮아용?</p>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 13px; color: #5D6660">마루국밥 본점에서 회사(역삼동)로, 25분쯤</div>
<div style="display: flex; justify-content: space-between; font-size: 16px">
<span>돼지국밥 1개</span><span class="num">9,000원</span>
</div>
<div style="display: flex; justify-content: space-between; font-size: 14px; color: #5D6660">
<span>요청: 깍두기 많이</span>
</div>
<div style="height: 1px; background: #EEF2EC; margin: 4px 0"></div>
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 15px; font-weight: 600">결제할 금액</span>
<span class="num" style="font-size: 24px; font-weight: 700; letter-spacing: -0.02em">9,000원</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 14px">
<div style="font-size: 14px; font-weight: 600">용이가 쓸 수 있는 돈</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 13px"><span style="color: #5D6660">한 번에</span><span class="num"><b style="font-weight: 600">9,000</b><span style="color: #5D6660"> / 10,000원</span></span></div>
<div style="height: 8px; background: #E3E8E2; border-radius: 4px; overflow: hidden"><div style="width: 90%; height: 8px; background: {{sy_accent}}; border-radius: 4px"></div></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 13px"><span style="color: #5D6660">30일 동안 (주문 후)</span><span class="num"><b style="font-weight: 600">219,000</b><span style="color: #5D6660"> / 500,000원</span></span></div>
<div style="height: 8px; background: #E3E8E2; border-radius: 4px; overflow: hidden"><div style="width: 44%; height: 8px; background: {{sy_accent}}; border-radius: 4px"></div></div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 4px">
<button style="height: 56px; border: 0; border-radius: 18px; background: {{sy_accent}}; color: #FFFFFF; font-size: 17px; font-weight: 700"><span class="num">9,000원</span> 시키기</button>
<button style="height: 48px; border: 0; background: transparent; color: #5D6660; font-size: 15px">다시 고를래</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"species": {"editor": "enum", "default": "숲용", "options": ["숲용", "물용", "꽃용", "별용"]}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
syT() {
const KO = { '숲용': 'forest', '물용': 'water', '꽃용': 'flower', '별용': 'star' };
const T = {
forest: { name: '숲용', accent: '#2E7D4F', bg: '#F6F8F4', tint: '#E4F4E6', dark: '#1F5C3A', body: '#8FD694' },
water: { name: '물용', accent: '#1F6A93', bg: '#F3F7FA', tint: '#E3F1F9', dark: '#154A68', body: '#9AD3F0' },
flower: { name: '꽃용', accent: '#B03A64', bg: '#FAF4F6', tint: '#FBE6EE', dark: '#7D2846', body: '#F7B7C8' },
star: { name: '별용', accent: '#5F47A8', bg: '#F6F4FA', tint: '#ECE6FA', dark: '#43317A', body: '#C9B8F2' }
};
const raw = (this.state && this.state.picked) || this.props.species || '숲용';
return T[KO[raw] || raw] || T.forest;
}
renderVals() {
const t = this.syT();
const k = Object.keys({ forest: 1, water: 1, flower: 1, star: 1 }).find((x) => t.accent === ({ forest: '#2E7D4F', water: '#1F6A93', flower: '#B03A64', star: '#5F47A8' })[x]);
const show = (x) => (x === k ? 'inline' : 'none');
return Object.assign({}, this.syBase(), { sy_accent: t.accent, sy_bg: t.bg, sy_tint: t.tint, sy_dark: t.dark, sy_name: t.name, dragon: t.body, sy_c_forest: show('forest'), sy_c_water: show('water'), sy_c_flower: show('flower'), sy_c_star: show('star') });
}
syBase() {
return { dragon: this.props.dragon ?? '#8FD694' };
}
}
</script>
</body>
</html>
