<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>시켜용 알 이름 짓기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&amp;display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Pretendard";src:url(/_blob/595108c608f096ad66f6d78ef534a70e) format("woff2");font-weight:45 920;font-display:swap}
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #2E7D4F;outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{sy_bg}}; color: #1E2320; font-family: Pretendard, system-ui, sans-serif; letter-spacing: -0.01em; word-break: keep-all; display: flex; flex-direction: column; gap: 22px; padding: 8px 20px 32px; overflow: hidden">

<div style="display: flex; align-items: center; gap: 8px; height: 48px">
<button aria-label="뒤로" style="width: 44px; height: 44px; margin-left: -10px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1E2320" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<div style="flex-grow: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px" aria-label="3단계 중 2단계">
<div style="height: 4px; border-radius: 2px; background: {{sy_accent}}"></div>
<div style="height: 4px; border-radius: 2px; background: {{sy_accent}}"></div>
<div style="height: 4px; border-radius: 2px; background: #E3E8E2"></div>
</div>
</div>

<h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.35">알을 하나 골라<br>이름을 지어 주세요</h1>

<div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
<svg width="132" height="132" viewBox="0 0 64 64" aria-hidden="true" style="display: {{show_forest}}"><ellipse cx="32" cy="61" rx="15" ry="2" fill="#DCE3D9"></ellipse><path d="M32 6 C44 6 52 24 52 39 C52 52 43 60 32 60 C21 60 12 52 12 39 C12 24 20 6 32 6 Z" fill="#FFFDF6" stroke="#1E2320" stroke-width="1.4"></path><path d="M22 31 C19 28 20 24 24 24 C25 27 24 30 22 31 Z" fill="#8FD694"></path><path d="M40 44 C37 41 38 37 42 37 C43 40 42 43 40 44 Z" fill="#8FD694"></path><path d="M29 52 C27 50 28 47 30 47 C31 49 30 51 29 52 Z" fill="#8FD694"></path><path d="M38 21 C36 19 37 16 39 16 C40 18 39 20 38 21 Z" fill="#8FD694"></path></svg>
<svg width="132" height="132" viewBox="0 0 64 64" aria-hidden="true" style="display: {{show_water}}"><ellipse cx="32" cy="61" rx="15" ry="2" fill="#DCE3D9"></ellipse><path d="M32 6 C44 6 52 24 52 39 C52 52 43 60 32 60 C21 60 12 52 12 39 C12 24 20 6 32 6 Z" fill="#FFFDF6" stroke="#1E2320" stroke-width="1.4"></path><path d="M14.5 30 Q19 26.5 23.5 30 T32.5 30 T41.5 30 T50 29" fill="none" stroke="#9AD3F0" stroke-width="2.6" stroke-linecap="round"></path><path d="M13 42 Q18 38.5 23 42 T33 42 T43 42 T51.5 41" fill="none" stroke="#9AD3F0" stroke-width="2.6" stroke-linecap="round"></path></svg>
<svg width="132" height="132" viewBox="0 0 64 64" aria-hidden="true" style="display: {{show_flower}}"><ellipse cx="32" cy="61" rx="15" ry="2" fill="#DCE3D9"></ellipse><path d="M32 6 C44 6 52 24 52 39 C52 52 43 60 32 60 C21 60 12 52 12 39 C12 24 20 6 32 6 Z" fill="#FFFDF6" stroke="#1E2320" stroke-width="1.4"></path><g fill="#F7B7C8"><circle cx="23" cy="29" r="2"></circle><circle cx="26.4" cy="29" r="2"></circle><circle cx="24.7" cy="26.4" r="2"></circle><circle cx="24.7" cy="31.6" r="2"></circle><circle cx="39" cy="43" r="2"></circle><circle cx="42.4" cy="43" r="2"></circle><circle cx="40.7" cy="40.4" r="2"></circle><circle cx="40.7" cy="45.6" r="2"></circle><circle cx="29" cy="51" r="1.4"></circle><circle cx="39" cy="21" r="1.4"></circle></g><circle cx="24.7" cy="29" r="1" fill="#FFD15C"></circle><circle cx="40.7" cy="43" r="1" fill="#FFD15C"></circle></svg>
<svg width="132" height="132" viewBox="0 0 64 64" aria-hidden="true" style="display: {{show_star}}"><ellipse cx="32" cy="61" rx="15" ry="2" fill="#DCE3D9"></ellipse><path d="M32 6 C44 6 52 24 52 39 C52 52 43 60 32 60 C21 60 12 52 12 39 C12 24 20 6 32 6 Z" fill="#FFFDF6" stroke="#1E2320" stroke-width="1.4"></path><path d="M24 25 L25.2 28 L28.4 28.2 L25.9 30.2 L26.7 33.3 L24 31.5 L21.3 33.3 L22.1 30.2 L19.6 28.2 L22.8 28 Z" fill="#C9B8F2"></path><path d="M40 39 L41.2 42 L44.4 42.2 L41.9 44.2 L42.7 47.3 L40 45.5 L37.3 47.3 L38.1 44.2 L35.6 42.2 L38.8 42 Z" fill="#C9B8F2"></path><circle cx="30" cy="51" r="1.4" fill="#C9B8F2"></circle><circle cx="38" cy="20" r="1.4" fill="#C9B8F2"></circle><path d="M46 30 A4 4 0 1 1 42 26 A3 3 0 1 0 46 30 Z" fill="#C9B8F2"></path></svg>
<div style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 48px">
<div style="font-size: 17px; font-weight: 700">{{name}}</div>
<div style="font-family: 'Gowun Dodum', Pretendard, sans-serif; font-size: 16px; letter-spacing: 0; color: #5D6660">"{{line}}"</div>
</div>
<div style="display: flex; gap: 10px" role="radiogroup" aria-label="알">
<button role="radio" aria-checked="{{on_forest}}" aria-label="숲용 알" onClick="{{pick_forest}}" style="{{ring_forest}}"><svg width="40" height="40" viewBox="4 2 56 60" aria-hidden="true"><path d="M32 6 C44 6 52 24 52 39 C52 52 43 60 32 60 C21 60 12 52 12 39 C12 24 20 6 32 6 Z" fill="#FFFDF6" stroke="#1E2320" stroke-width="1.4"></path><path d="M22 31 C19 28 20 24 24 24 C25 27 24 30 22 31 Z" fill="#8FD694"></path><path d="M40 44 C37 41 38 37 42 37 C43 40 42 43 40 44 Z" fill="#8FD694"></path><path d="M29 52 C27 50 28 47 30 47 C31 49 30 51 29 52 Z" fill="#8FD694"></path><path d="M38 21 C36 19 37 16 39 16 C40 18 39 20 38 21 Z" fill="#8FD694"></path></svg></button>
<button role="radio" aria-checked="{{on_water}}" aria-label="물용 알" onClick="{{pick_water}}" style="{{ring_water}}"><svg width="40" height="40" viewBox="4 2 56 60" aria-hidden="true"><path d="M32 6 C44 6 52 24 52 39 C52 52 43 60 32 60 C21 60 12 52 12 39 C12 24 20 6 32 6 Z" fill="#FFFDF6" stroke="#1E2320" stroke-width="1.4"></path><path d="M14.5 30 Q19 26.5 23.5 30 T32.5 30 T41.5 30 T50 29" fill="none" stroke="#9AD3F0" stroke-width="2.6" stroke-linecap="round"></path><path d="M13 42 Q18 38.5 23 42 T33 42 T43 42 T51.5 41" fill="none" stroke="#9AD3F0" stroke-width="2.6" stroke-linecap="round"></path></svg></button>
<button role="radio" aria-checked="{{on_flower}}" aria-label="꽃용 알" onClick="{{pick_flower}}" style="{{ring_flower}}"><svg width="40" height="40" viewBox="4 2 56 60" aria-hidden="true"><path d="M32 6 C44 6 52 24 52 39 C52 52 43 60 32 60 C21 60 12 52 12 39 C12 24 20 6 32 6 Z" fill="#FFFDF6" stroke="#1E2320" stroke-width="1.4"></path><g fill="#F7B7C8"><circle cx="23" cy="29" r="2"></circle><circle cx="26.4" cy="29" r="2"></circle><circle cx="24.7" cy="26.4" r="2"></circle><circle cx="24.7" cy="31.6" r="2"></circle><circle cx="39" cy="43" r="2"></circle><circle cx="42.4" cy="43" r="2"></circle><circle cx="40.7" cy="40.4" r="2"></circle><circle cx="40.7" cy="45.6" r="2"></circle><circle cx="29" cy="51" r="1.4"></circle><circle cx="39" cy="21" r="1.4"></circle></g><circle cx="24.7" cy="29" r="1" fill="#FFD15C"></circle><circle cx="40.7" cy="43" r="1" fill="#FFD15C"></circle></svg></button>
<button role="radio" aria-checked="{{on_star}}" aria-label="별용 알" onClick="{{pick_star}}" style="{{ring_star}}"><svg width="40" height="40" viewBox="4 2 56 60" aria-hidden="true"><path d="M32 6 C44 6 52 24 52 39 C52 52 43 60 32 60 C21 60 12 52 12 39 C12 24 20 6 32 6 Z" fill="#FFFDF6" stroke="#1E2320" stroke-width="1.4"></path><path d="M24 25 L25.2 28 L28.4 28.2 L25.9 30.2 L26.7 33.3 L24 31.5 L21.3 33.3 L22.1 30.2 L19.6 28.2 L22.8 28 Z" fill="#C9B8F2"></path><path d="M40 39 L41.2 42 L44.4 42.2 L41.9 44.2 L42.7 47.3 L40 45.5 L37.3 47.3 L38.1 44.2 L35.6 42.2 L38.8 42 Z" fill="#C9B8F2"></path><circle cx="30" cy="51" r="1.4" fill="#C9B8F2"></circle><circle cx="38" cy="20" r="1.4" fill="#C9B8F2"></circle><path d="M46 30 A4 4 0 1 1 42 26 A3 3 0 1 0 46 30 Z" fill="#C9B8F2"></path></svg></button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="dn" style="font-size: 13px; font-weight: 600; color: #5D6660">이름</label>
<input id="dn" value="용이" maxlength="8" style="height: 52px; box-sizing: border-box; padding: 0 16px; border: 1px solid #D5DDD3; border-radius: 14px; background: #FFFFFF; font: inherit; font-size: 17px; font-weight: 600; color: #1E2320">
</div>

<p class="num" style="margin: -12px 0 0; font-size: 14px; color: #5D6660">처음엔 한 번에 10,000원까지. 깨어나면 바꿀 수 있어요.</p>

<div style="flex-grow: 1"></div>
<button style="height: 56px; border: 0; border-radius: 18px; background: {{sy_accent}}; color: #FFFFFF; font-size: 17px; font-weight: 700">알 깨우기</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"species": {"editor": "enum", "default": "숲용", "options": ["숲용", "물용", "꽃용", "별용"]}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
constructor(p) { super(p); this.state = { picked: 'forest' }; }
syT() {
const KO = { '숲용': 'forest', '물용': 'water', '꽃용': 'flower', '별용': 'star' };
const T = {
forest: { name: '숲용', accent: '#2E7D4F', bg: '#F6F8F4', tint: '#E4F4E6', dark: '#1F5C3A', body: '#8FD694' },
water: { name: '물용', accent: '#1F6A93', bg: '#F3F7FA', tint: '#E3F1F9', dark: '#154A68', body: '#9AD3F0' },
flower: { name: '꽃용', accent: '#B03A64', bg: '#FAF4F6', tint: '#FBE6EE', dark: '#7D2846', body: '#F7B7C8' },
star: { name: '별용', accent: '#5F47A8', bg: '#F6F4FA', tint: '#ECE6FA', dark: '#43317A', body: '#C9B8F2' }
};
const raw = (this.state && this.state.picked) || this.props.species || '숲용';
return T[KO[raw] || raw] || T.forest;
}
renderVals() {
const t = this.syT();
const k = Object.keys({ forest: 1, water: 1, flower: 1, star: 1 }).find((x) => t.accent === ({ forest: '#2E7D4F', water: '#1F6A93', flower: '#B03A64', star: '#5F47A8' })[x]);
const show = (x) => (x === k ? 'inline' : 'none');
return Object.assign({}, this.syBase(), { sy_accent: t.accent, sy_bg: t.bg, sy_tint: t.tint, sy_dark: t.dark, sy_name: t.name, dragon: t.body, sy_c_forest: show('forest'), sy_c_water: show('water'), sy_c_flower: show('flower'), sy_c_star: show('star') });
}
syBase() {
const list = [
{ k: 'forest', name: '숲용', line: '천천히 먹어용' },
{ k: 'water', name: '물용', line: '국물이 최고예용' },
{ k: 'flower', name: '꽃용', line: '오늘도 수고했어용' },
{ k: 'star', name: '별용', line: '야식은 반만 먹어용' }
];
const picked = this.state.picked;
const cur = list.find((x) => x.k === picked);
const out = { name: cur.name, line: cur.line };
list.forEach((x) => {
const on = x.k === picked;
out['show_' + x.k] = on ? 'block' : 'none';
out['on_' + x.k] = on ? 'true' : 'false';
out['ring_' + x.k] = 'width: 60px; height: 60px; border-radius: 30px; background: ' + (on ? '#FFFFFF' : 'transparent') + '; display: flex; align-items: center; justify-content: center; border: 2px solid ' + (on ? '' + this.syT().accent + '' : 'transparent');
out['pick_' + x.k] = () => this.setState({ picked: x.k });
});
return out;
}
}
</script>
</body>
</html>
